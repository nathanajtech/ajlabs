<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded base background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#brand)" stroke-width="6" opacity="0.6"/>

  <!-- Glowing inner circle -->
  <circle cx="256" cy="256" r="160" fill="#030712" stroke="url(#brand)" stroke-width="8" stroke-dasharray="16 8"/>

  <!-- AJ Monogram Typography -->
  <text x="256" y="295" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="140" fill="url(#gold)" text-anchor="middle" letter-spacing="-6">
    AJ
  </text>
  
  <!-- Subtitle Labs -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="8">
    LABS
  </text>

  <!-- Sparkle indicator -->
  <path d="M 370 140 Q 370 160 390 160 Q 370 160 370 180 Q 370 160 350 160 Q 370 160 370 140 Z" fill="#fbbf24"/>
</svg>
